name: Generate Release Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        shell: bash
        run: |
          set -e
          KEYSTORE_PASSWORD="CHANGE_ME_STOREPASS"
          KEY_PASSWORD="CHANGE_ME_KEYPASS"
          KEY_ALIAS="vrca"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VRC-A, OU=VRChat, O=Ashoska Mitsu Sisko, L=Unknown, S=Unknown, C=GB"

          # Base64 it for secrets usage
          base64 -w 0 release.keystore > release.keystore.b64

          # Save helper values for you
          echo "$KEY_ALIAS" > key_alias.txt
          echo "$KEYSTORE_PASSWORD" > keystore_password.txt
          echo "$KEY_PASSWORD" > key_password.txt

      - name: Upload keystore + base64
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.b64
            key_alias.txt
            keystore_password.txt
            key_password.txt
