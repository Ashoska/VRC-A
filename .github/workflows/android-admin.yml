name: Android CI (Admin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Create signing files ONLY if secrets exist
      - name: Create signing files (if secrets set)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_OWNER: ${{ secrets.RELEASE_OWNER }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
        run: |
          set -e

          # Always write GitHub release credentials so admin build can push releases
          cat > keystore.properties <<EOF
githubPat=${RELEASE_PAT}
githubOwner=${RELEASE_OWNER}
githubRepo=${RELEASE_REPO}
EOF

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets found. Release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          # Append signing keys to the same file
          cat >> keystore.properties <<EOF
storeFile=release.keystore
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

          echo "Signing files created."

      # Ã¢Å“â€¦ Admin flavor builds
      - name: Build Admin Debug APK
        run: ./gradlew :app:assembleAdminAppDebug

      - name: Build Admin Release APK
        run: ./gradlew :app:assembleAdminAppRelease

      - name: Upload Admin Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-debug
          path: app/build/outputs/apk/adminApp/debug/*.apk

      - name: Upload Admin Release APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-release
          path: app/build/outputs/apk/adminApp/release/*.apk
