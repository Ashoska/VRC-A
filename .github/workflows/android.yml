name: Android CI

on:
  push:
    # claude/** so every commit pushed to a claude working branch builds + uploads
    # the APK artifacts (public/admin/headset, debug+release) — testable straight
    # from the Actions run, no PR needed.
    branches: [ "main", "VRC-A-Official", "claude/**" ]
  pull_request:
    branches: [ "main", "VRC-A-Official" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create keystore.properties
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_OWNER: ${{ secrets.RELEASE_OWNER }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
        run: |
          set -e

          printf 'githubPat=%s\ngithubOwner=%s\ngithubRepo=%s\n' \
            "$RELEASE_PAT" "$RELEASE_OWNER" "$RELEASE_REPO" \
            > keystore.properties

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets - release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            >> keystore.properties

          echo "Signing files created."

      - name: Build Public Debug APK
        run: ./gradlew :app:assemblePublicAppDebug

      - name: Build Public Release APK
        run: ./gradlew :app:assemblePublicAppRelease

      - name: Build Admin Debug APK
        run: ./gradlew :app:assembleAdminAppDebug

      - name: Build Admin Release APK
        run: ./gradlew :app:assembleAdminAppRelease

      - name: Build Headset Debug APK
        run: ./gradlew :app:assembleHeadsetAppDebug

      - name: Build Headset Release APK
        run: ./gradlew :app:assembleHeadsetAppRelease

      - name: Upload Public Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: public-debug
          path: app/build/outputs/apk/publicApp/debug/*.apk
          retention-days: 3

      - name: Upload Public Release APK
        uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: app/build/outputs/apk/publicApp/release/*.apk
          retention-days: 3

      - name: Upload Admin Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-debug
          path: app/build/outputs/apk/adminApp/debug/*.apk
          retention-days: 3

      - name: Upload Admin Release APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release
          path: app/build/outputs/apk/adminApp/release/*.apk
          retention-days: 3

      - name: Upload Headset Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: headset-debug
          path: app/build/outputs/apk/headsetApp/debug/*.apk
          retention-days: 3

      - name: Upload Headset Release APK
        uses: actions/upload-artifact@v4
        with:
          name: headset-release
          path: app/build/outputs/apk/headsetApp/release/*.apk
          retention-days: 3
