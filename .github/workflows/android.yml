name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Create keystore + keystore.properties ONLY if secrets exist
      - name: Create signing files (if secrets set)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets found. Release build will be skipped."
            exit 0
          fi

          # ✅ Put keystore where Gradle expects it: app/release.keystore
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

          # ✅ keystore.properties at repo root (matches your build.gradle code)
          cat > keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing files created."

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # Only build release if signing secrets exist
      - name: Build Release APK (signed)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
