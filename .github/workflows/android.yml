name: Android CI

on:
  push:
    # claude/** so every commit pushed to a claude working branch builds + uploads
    # the release APK artifacts (public/admin/headset) — testable straight from the
    # Actions run, no PR needed. Debug APKs are intentionally NOT built (they only
    # doubled build time; we install the signed release APKs).
    branches: [ "main", "VRC-A-Official", "claude/**" ]
  pull_request:
    branches: [ "main", "VRC-A-Official" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Pre-provision Gradle distribution (retry transient 503s)
        # The Gradle wrapper downloads its distribution from services.gradle.org,
        # which redirects to github.com/gradle/gradle-distributions. That host can
        # return a transient 503, and the wrapper has NO retry — so the very first
        # ./gradlew call fails and kills the whole run. Do a cheap `--version` up
        # front with retries + backoff: a blip is ridden out, and once it succeeds
        # the distribution is cached so the (longer) build steps never re-download.
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            echo "Gradle distribution download attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "Gradle distribution could not be downloaded after 5 attempts."
          exit 1

      - name: Create keystore.properties
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_OWNER: ${{ secrets.RELEASE_OWNER }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
        run: |
          set -e

          printf 'githubPat=%s\ngithubOwner=%s\ngithubRepo=%s\n' \
            "$RELEASE_PAT" "$RELEASE_OWNER" "$RELEASE_REPO" \
            > keystore.properties

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets - release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            >> keystore.properties

          echo "Signing files created."

      - name: Build Public Release APK
        run: ./gradlew :app:assemblePublicAppRelease

      - name: Build Admin Release APK
        run: ./gradlew :app:assembleAdminAppRelease

      - name: Build Headset Release APK
        run: ./gradlew :app:assembleHeadsetAppRelease

      - name: Upload Public Release APK
        uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: app/build/outputs/apk/publicApp/release/*.apk
          retention-days: 3

      - name: Upload Admin Release APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-release
          path: app/build/outputs/apk/adminApp/release/*.apk
          retention-days: 3

      - name: Upload Headset Release APK
        uses: actions/upload-artifact@v4
        with:
          name: headset-release
          path: app/build/outputs/apk/headsetApp/release/*.apk
          retention-days: 3
