name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Create signing files ONLY if secrets exist
      - name: Create signing files (if secrets set)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets found. Release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing files created."

      # Build exact variants (flavors)
      - name: Build Public Debug + Release
        run: |
          ./gradlew :app:assemblePublicAppDebug :app:assemblePublicAppRelease

      - name: Build Admin Debug
        run: |
          ./gradlew :app:assembleAdminAppDebug

      # Only attempt Admin Release if signing exists (optional but nice)
      - name: Build Admin Release (if signing exists)
        shell: bash
        run: |
          if [ -f "keystore.properties" ]; then
            ./gradlew :app:assembleAdminAppRelease
          else
            echo "Skipping Admin Release (no signing secrets)."
          fi

      # Upload ALL APKs regardless of flavor folder structure
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/*
