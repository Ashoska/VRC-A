name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Create signing files ONLY if secrets exist
      - name: Create signing files (if secrets set)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets found. Release will be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > release.keystore

          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing files created."

      # ✅ Build ONLY the PUBLIC variant (no admin)
      - name: Build Public Debug APK
        run: ./gradlew :app:assemblePublicAppDebug

      - name: Build Public Release APK
        run: ./gradlew :app:assemblePublicAppRelease

      # ✅ Upload ONLY public apks as two separate artifacts (like your screenshot)
      - name: Upload Public Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/publicApp/debug/*.apk

      - name: Upload Public Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/publicApp/release/*.apk
