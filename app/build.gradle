// app/build.gradle (Module: app)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.mikepenz.aboutlibraries.plugin'

    // Firebase / Google Services
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// GitHub release credentials (admin build only). Add to keystore.properties:
//   githubPat=ghp_xxxxxxxxxxxxxxxxxxxx
//   githubOwner=your-github-username
//   githubRepo=your-repo-name
def githubPat   = keystoreProperties['githubPat']   ?: ""
def githubOwner = keystoreProperties['githubOwner'] ?: ""
def githubRepo  = keystoreProperties['githubRepo']  ?: ""

// =========================
// Ã¢Å“â€¦ Auto versioning (GitHub Actions)
// Goal:
//  - versionCode: always increasing (use GITHUB_RUN_NUMBER when available)
//  - versionName: vMAJOR.MINOR.PATCH where:
//      * PATCH is 0..99
//      * every +100 builds => MINOR increments by 1, PATCH rolls over
//      * no manual edits needed at 100 / 1000 / etc
// =========================
def ghRunNumberStr = System.getenv("GITHUB_RUN_NUMBER") ?: ""
def ghRunNumber = 0
try {
    ghRunNumber = (ghRunNumberStr?.trim()?.isInteger()) ? ghRunNumberStr.toInteger() : 0
} catch (ignored) {
    ghRunNumber = 0
}

// Base semantic version
def baseMajor = 1
def baseMinor = 2

// Choose where "patch/minor counting" starts from.
def baseRunOffset = 200

// Local fallback for Android Studio builds when env var isn't set
def localFallbackRun = 279

def run = (ghRunNumber > 0) ? ghRunNumber : localFallbackRun

// Relative build count since baseRunOffset (never negative)
def rel = Math.max(0, run - baseRunOffset)

// Roll patch every 100, bump minor accordingly
def minorBump = (int)(rel / 100)
def patch = (int)(rel % 100)

def computedVersionCode = run
def computedVersionName = "v${baseMajor}.${baseMinor + minorBump}.${patch}"

android {
    namespace 'com.vrca'
    compileSdk 34

    defaultConfig {
        // default = PUBLIC id; admin flavor overrides
        applicationId "com.scrapw.chatbox"
        minSdk 26
        targetSdk 34

        versionCode computedVersionCode
        versionName computedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    // Ã¢Å“â€¦ REQUIRED: flavors so Gradle creates adminApp/publicApp tasks
    flavorDimensions += "app"
    productFlavors {
        publicApp {
            dimension "app"
            // Uses default applicationId com.scrapw.chatbox
            buildConfigField "boolean", "IS_ADMIN_BUILD", "false"
            buildConfigField "String", "GITHUB_PAT",   '""'
            buildConfigField "String", "GITHUB_OWNER", '""'
            buildConfigField "String", "GITHUB_REPO",  '""'
            resValue "string", "app_name", "VRC-A"
        }
        adminApp {
            dimension "app"
            applicationId "com.scrapw.chatbox.admin"
            buildConfigField "boolean", "IS_ADMIN_BUILD", "true"
            buildConfigField "String", "GITHUB_PAT",   "\"${githubPat}\""
            buildConfigField "String", "GITHUB_OWNER", "\"${githubOwner}\""
            buildConfigField "String", "GITHUB_REPO",  "\"${githubRepo}\""
            resValue "string", "app_name", "VRC-A Admin"
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                def storeFilePath = keystoreProperties['storeFile']?.toString()?.trim()
                if (storeFilePath == null || storeFilePath.isEmpty()) {
                    throw new GradleException("keystore.properties exists but storeFile is missing")
                }

                storeFile rootProject.file(storeFilePath)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug { }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.9'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

aboutLibraries {
    configPath = "config"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.foundation:foundation:1.7.0-beta04'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.compose.material:material-icons-extended:1.6.1"

    // Ã¢Å“â€¦ DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Lifecycle + Navigation
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation 'androidx.navigation:navigation-runtime-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // OSC
    implementation 'com.illposed.osc:javaosc-core:0.7'

    // Settings storage
    implementation 'com.github.alorma:compose-settings-storage-base:1.0.3'
    implementation 'com.github.alorma:compose-settings-storage-datastore:0.27.0'

    // OkHttp â€” WebSocket for VRChat pipeline
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // EncryptedSharedPreferences for VRChat auth cookie storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // AboutLibraries
    implementation "com.mikepenz:aboutlibraries-core:${latestAboutLibsRelease}"
    implementation "com.mikepenz:aboutlibraries-compose-m3:${latestAboutLibsRelease}"

    // Ã¢Å“â€¦ Firebase
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"

    // WorkManager — periodic watchdog that re-arms the foreground pipeline service
    // if an aggressive OEM kills the process while the user is logged in.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Coil — async image loading for admin profile pictures
    implementation "io.coil-kt:coil-compose:2.6.0"

    // Media3 Transformer — ADMIN-ONLY on-device video transcode (1080p HEVC, small)
    // before rich-content upload. Not in the public APK (adminAppImplementation).
    adminAppImplementation "androidx.media3:media3-transformer:1.3.1"
    adminAppImplementation "androidx.media3:media3-common:1.3.1"
    adminAppImplementation "androidx.media3:media3-effect:1.3.1"

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
