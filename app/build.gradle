// app/build.gradle

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.mikepenz.aboutlibraries.plugin'
}

android {
    namespace 'com.scrapw.chatbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.scrapw.chatbox"
        minSdk 26
        targetSdk 34

        // --- Auto-versioning (GitHub Actions run number) ---
        // In GitHub Actions: GITHUB_RUN_NUMBER is always set (1,2,3,...)
        // Locally: fallback to 1 so debug builds still work.
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode runNumber

        // Keep versionName human-readable. Example: 1.0.123
        def baseVersion = "1.0"
        versionName "${baseVersion}.${runNumber}"

        // If you use vector drawables
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // --- Signing (CI-only, GitHub Secrets) ---
    // This reads keystore.properties if it exists.
    // On your PC: it won't exist -> release builds are not signed (debug still works).
    // In GitHub Actions: workflow creates keystore.properties on the runner -> release gets signed.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    def hasKeystoreProps = keystorePropsFile.exists()

    if (hasKeystoreProps) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        release {
            if (hasKeystoreProps) {
                storeFile file(keystoreProps['storeFile'] ?: "")
                storePassword (keystoreProps['storePassword'] ?: "")
                keyAlias (keystoreProps['keyAlias'] ?: "")
                keyPassword (keystoreProps['keyPassword'] ?: "")
            }
        }
    }

    buildTypes {
        debug {
            // debug stays debug-signed
            minifyEnabled false
        }

        release {
            // If CI provided keystore.properties, sign; otherwise leave unsigned.
            if (hasKeystoreProps) {
                signingConfig signingConfigs.release
            }

            // Keep these as your project needs (change if you already use minify)
            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += [
                    '/META-INF/{AL2.0,LGPL2.1}',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt'
            ]
        }
    }
}

dependencies {
    // Your existing deps stay as-is — keep whatever you already have in your project.
    // If your current app/build.gradle already has dependencies, DO NOT delete them:
    // copy/paste them back under this comment.

    // Example only (remove if not used in your current project):
    // implementation "androidx.core:core-ktx:1.13.1"
}
