// Root build.gradle (DO NOT put android { } here)

plugins {
    // Versions are REQUIRED here, but we do NOT apply them at root
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false
    // Kotlin 2's Compose compiler (replaces composeOptions.kotlinCompilerExtensionVersion).
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false

    // AboutLibraries
    id 'com.mikepenz.aboutlibraries.plugin' version '11.3.0' apply false

    // ✅ Firebase / Google Services
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
