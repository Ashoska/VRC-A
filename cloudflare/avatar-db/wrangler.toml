# Cloudflare Worker config for the VRC-A avatar catalog (R2-only).
# Used by Workers Builds (Git integration) to auto-deploy on every push, so the
# Worker never has to be pasted into the dashboard by hand again.
#
# Secrets (set in the dashboard, persist across deploys):
#   ADMIN_KEY       gate for /admin, /admin/reports, /admin/reshard
#   CF_PURGE_TOKEN  + CF_ZONE_ID  (optional) — purge-on-write for ~1s propagation
# GitHub is GONE: the catalog lives entirely in R2, both apps AND bots read the shards
# from the CDN, and the rebuild Action (R2-only) builds search+master+manifest+worklist.
# The old GH_TOKEN secret is unused now and can be deleted from the dashboard.

name = "vrca-avatar-db"
main = "worker.js"
compatibility_date = "2026-08-18"

# The pending-queue KV store (Cloudflare -> Storage & databases -> KV).
[[kv_namespaces]]
binding = "AVATAR_KV"
id = "e72fc7074f9f44c3b9cde9f6ac7a646b"

# R2 bucket holding the sharded catalog (shard/<3hex>.json + fragments/index/avtr + db.json
# master + _manifest.json + _worklist.json). This is the ONLY store now.
# BACKUP: enable R2 object versioning on this bucket (R2 -> the bucket -> Settings ->
# Object versioning) for point-in-time recovery; db.json is the full-master snapshot the
# rebuild Action writes each run, and GET /admin/reshard re-shards from it if ever needed.
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "vrca-avatar-catalog"

[vars]
# Where the apps + bots read the sharded catalog from (they append /shard/<prefix>.json,
# /fragments/..., /_manifest.json, /_worklist.json). /health echoes this so a serving change
# (e.g. a new domain) needs no app update. Points at the R2 bucket's custom domain.
CATALOG_BASE = "https://cdn.gremlininc.app"

[triggers]
# Cheap per-shard R2 writes, so run every minute — paired with purge-on-write this makes a
# new avatar live for everyone in ~1s.
crons = ["* * * * *"]
