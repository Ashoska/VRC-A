# Cloudflare Worker config for the VRC-A avatar catalog (R2-only).
# Used by Workers Builds (Git integration) to auto-deploy on every push, so the
# Worker never has to be pasted into the dashboard by hand again.
#
# Secrets (set in the dashboard, persist across deploys):
#   ADMIN_KEY       gate for /admin, /admin/reports, /admin/reshard
#   CF_PURGE_TOKEN  + CF_ZONE_ID  (optional) — purge-on-write for ~1s propagation
# GitHub is GONE: the catalog lives entirely in R2, both apps AND bots read the shards
# from the CDN, and the rebuild Action (R2-only) builds search+master+manifest+worklist.
# The old GH_TOKEN secret is unused now and can be deleted from the dashboard.

name = "vrca-avatar-db"
main = "worker.js"
compatibility_date = "2026-08-18"

# The main domain serves this Worker (custom domain, attached 2026-10-30): https://gremlininc.app/ is the live
# page (the root is the live page only on this host; every other endpoint answers here too). Kept in config so a
# deploy never drops it.
routes = [{ pattern = "gremlininc.app", custom_domain = true }]
# KEEP: the apps and admin bots call the workers.dev address. With `routes` set, wrangler turns workers.dev OFF
# unless this says otherwise (that happened 2026-10-30: error 1042 on every app/bot call for ~12 min).
workers_dev = true

# The pending-queue KV store (Cloudflare -> Storage & databases -> KV).
[[kv_namespaces]]
binding = "AVATAR_KV"
id = "e72fc7074f9f44c3b9cde9f6ac7a646b"

# R2 bucket holding the sharded catalog (shard/<3hex>.json + fragments/index/avtr + db.json
# master + _manifest.json + _worklist.json). This is the ONLY store now.
# BACKUP: enable R2 object versioning on this bucket (R2 -> the bucket -> Settings ->
# Object versioning) for point-in-time recovery; db.json is the full-master snapshot the
# rebuild Action writes each run, and GET /admin/reshard re-shards from it if ever needed.
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "vrca-avatar-catalog"

# Self service-binding: lets the flush continuation invoke THIS worker directly (env.SELF.fetch)
# for a fresh subrequest budget per drain step. A plain fetch() to our own workers.dev hostname is
# unreliable for self-invocation (Cloudflare loop-guard / edge-cache), so a service binding is the
# blessed path — it routes straight to a new invocation of this worker with no DNS/cache in between.
[[services]]
binding = "SELF"
service = "vrca-avatar-db"

[vars]
# Where the apps + bots read the sharded catalog from (they append /shard/<prefix>.json,
# /fragments/..., /_manifest.json, /_worklist.json). /health echoes this so a serving change
# (e.g. a new domain) needs no app update. Points at the R2 bucket's custom domain.
CATALOG_BASE = "https://cdn.gremlininc.app"

# The Worker's OWN routable URL — used by the self-chaining flush continuation to spawn a fresh
# invocation (fresh subrequest budget) per drain step. Must be a URL that re-enters THIS worker's
# fetch handler. Defaults to the workers.dev hostname if unset (see DEFAULT_SELF_URL in worker.js).
WORKER_SELF_URL = "https://vrca-avatar-db.shadowash321rulse.workers.dev"

# Reliable search-index rebuild: the Worker triggers the catalog-rebuild GitHub Action itself
# (GitHub's own `schedule:` cron drops most runs). Set these + a GH_DISPATCH_TOKEN secret
# (`wrangler secret put GH_DISPATCH_TOKEN` — a fine-grained PAT with Actions: write on the repo).
# Unset → falls back to GitHub's flaky cron. GH_REF is the default branch the workflow runs from.
GH_OWNER = "Ashoska"
GH_REPO = "VRC-A"
GH_REF = "VRC-A-Official"

# v52 hub: one Durable Object (strongly consistent) for the run lock, the records (`meta`, `recent`)
# and the live feed (/live page + /live/ws). SQLite-backed (Workers Paid includes its requests/storage).
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[triggers]
# Every minute (v52). v50 tried this on KV alone and runs skipped each other (KV can show another
# machine a value ~60 s old: the finished run's lock, or `meta` from before the previous run). Since v52
# the lock, `meta` and `recent` live in the HUB Durable Object above, which every run reads fresh.
# Backup steps still fire only on even minutes (their state stays in KV); maintenance keeps ~2 min.
crons = ["* * * * *"]
