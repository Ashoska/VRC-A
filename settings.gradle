pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Only for the official sherpa-onnx Android AAR (headset speech engine).
        exclusiveContent {
            forRepository { maven { url "https://jitpack.io" } }
            filter { includeGroup "com.github.k2-fsa.sherpa-onnx" }
        }
    }
}

rootProject.name = "Chatbox"
include(":app")
