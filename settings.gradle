pluginManagement {
    repositories {
        // Google's Maven Central mirror first: Maven Central rate-limits (HTTP 429) the shared
        // cloud-session egress, which failed every fresh lab/compile run. mavenCentral() stays as fallback.
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google's Maven Central mirror first: Maven Central rate-limits (HTTP 429) the shared
        // cloud-session egress, which failed every fresh lab/compile run. mavenCentral() stays as fallback.
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        // Only for the official sherpa-onnx Android AAR (headset speech engine).
        exclusiveContent {
            forRepository { maven { url "https://jitpack.io" } }
            filter { includeGroup "com.github.k2-fsa.sherpa-onnx" }
        }
    }
}

rootProject.name = "Chatbox"
include(":app")
